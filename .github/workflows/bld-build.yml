name: bld-build

on:
  pull_request:
  push:
    branches:
      - 'fix/**'

permissions:
  contents: read

jobs:
  bld-build:
    name: bld-build
    if: github.repository_owner == 'CodexCoder21Organization' && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'fix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xmx2g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
          java-package: jdk
      - name: spotless:check
        run: mvn --batch-mode --no-transfer-progress spotless:check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          java-package: jdk
      - name: Test
        run: mvn --batch-mode --no-transfer-progress test
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bld-test-results
          path: target/surefire-reports/**
          if-no-files-found: warn
